[project]
name = "clinicdoc"
version = "0.1.0"
description = "Offline clinical NLP dataset auditor — scan notes, labels, leakage, and identifiers before training."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Clinicdoc contributors" }]
keywords = ["clinical-nlp", "dataset", "audit", "NER", "PHI", "healthcare"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
clinicdoc = "clinidoc.cli:main"

[project.urls]
Homepage = "https://github.com/clinicdoc/clinicdoc"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
